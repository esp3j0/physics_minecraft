# REQ-012 B01a:手写四足(quad demo §13 定值,`demos/agents/quad/src/lib.rs`)。
# 真实单位(千克、米、牛·米);生成时质量/惯量/PD 增益/阻尼乘全局系数 k
# (默认 1/100,§4)。
#
# 尺寸/质量/关节限位/力矩上限取自 quad demo 常量:机身半长 0.19(盒)、
# Go2 真实几何 L = 0.213、髋距 HIP_X = 0.1934 / HIP_Z = 0.0465、大腿偏移
# THIGH_OFF = 0.0955;13 连杆 = 机身 + 4 腿 × (hip 球 + thigh 胶囊 + shank
# 胶囊),脚球 = shank 上带偏移的第二个形状(挂在小腿末端 (0, −L/2, 0))。
# PD:kp 100 / kd 3;力矩上限 23.7 N·m;脚摩擦 0.6;恢复系数 0。
# 腿序同 leg_signs():FL、FR、RL、RR(fx = 前/后,fz = 右/左)。
#
# default_angle = stand_targets(default_gait()) 的站立角(足端目标 (0, −0.28),
# 逆解 ik):lat = 0、hip pitch = −0.853596389、knee = 1.70719278(rad)。

