# REQ-012 A01:玩家默认身体(D1/`capsule` demo 定值)。
# 真实单位(千克、米);生成时质量/惯量/PD 增益乘全局系数 k(默认 1/100,§4):
# 胶囊进世界后质量 = 80 × 0.01 = 0.8。
#
# 胶囊 capsule_y(0.6, 0.3):总高 2·(0.6+0.3) = 1.8 m;锁定转动;
# 摩擦 μ = 0.3(capsule demo:μ 只决定主体对方块的摩擦,接缝/地面钩子 A02);
# 恢复系数 0(demo 放行取值)。

name = "capsule"
lock_rotations = true

# 行走控制器(REQ-012 A02a 第 1 节,capsule demo §13 定值):
# τ 0.2 s、F_max = 8·m·g、空中力系数 0.2、跳高 1.4 m、接地容差 0.05 m、
# 意图水平速度钳制 5.6 m/s。公式里的 m 取 rapier 刚体实际质量(乘过 k 的
# 0.8),不是这里的 80。
[walker]
tau = 0.2
fmax_g = 8.0
air = 0.2
jump_h = 1.4
ground_eps = 0.05
max_speed = 5.6

[[links]]
name = "torso"
mass = 80.0
friction = 0.3
restitution = 0.0

[[links.shapes]]
kind = "capsule_y"
half_height = 0.6
radius = 0.3
