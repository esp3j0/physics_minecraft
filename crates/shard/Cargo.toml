[package]
name = "shard"
version.workspace = true
edition.workspace = true

[dependencies]
types = { path = "../types" }
messaging = { path = "../messaging" }
physics-sim = { path = "../physics-sim" }
voxel = { path = "../voxel" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
# 测试钩子(REQ-007 06a):只给验收/集成测试在两拍之间人为制造不变量违反;
# 生产构建不启用(e2e 经 dev-dependency 打开)。
test-hooks = []

# 单元测试自用(钩子制造 I3 违反的 fail-stop 测试;只在 cargo test 构建)。
[dev-dependencies]
shard = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
