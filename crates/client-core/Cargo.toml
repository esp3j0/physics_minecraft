[package]
name = "client-core"
version.workspace = true
edition.workspace = true

[dependencies]
app = { path = "../app" }
messaging = { path = "../messaging" }
sim-api = { path = "../sim-api" }
types = { path = "../types" }
voxel = { path = "../voxel" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "io-util", "signal"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# 只为并入 test-util feature(start_paused 确定性对账测试),cargo 会与上面合并。
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
