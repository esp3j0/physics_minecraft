[package]
name = "infer-demo"
version = "0.1.0"
edition = "2021"

default-run = "infer"

[[bin]]
name = "infer"
path = "src/main.rs"

[dependencies]
quad = { path = "../quad" }
physics-sim = { path = "../../../crates/physics-sim" }
types = { path = "../../../crates/types" }
voxel = { path = "../../../crates/voxel" }
rapier3d = { version = "=0.36.1", features = ["serde-serialize"] }
tract-onnx = "0.23.10"
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"] }
rand = "0.9"
rand_chacha = "0.9"

[workspace]
