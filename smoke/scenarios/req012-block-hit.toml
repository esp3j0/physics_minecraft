name = "req012-block-hit"
req = "REQ-012"
description = "土方块从胶囊头顶上方 5 m 自由落下(初速 0)砸中站着的胶囊:胶囊被推开(实测位移见检查注释),落点周围地面区域 8×1×8=64 格 dirt 砸前砸后相等(地形不变,§11 第 2 行)"
timeout_secs = 240

[server]
world_seed = 5

[[step]]
camera = { pos = [10.0, -50.0, 24.0], yaw = -90.0, pitch = -25.0 }

[[step]]
look_at = { target = [10.0, -58.5, 14.0] }

[[step]]
wait_until = { block = { pos = [8, -61, 14], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

# 胶囊站立在 (8.5, 顶面 + 0.95, 14.5)。
[[step]]
label = "生成胶囊"
spawn_agent = { at = [8.5, -59.05, 14.5], yaw = 0.0, label = "hero" }

[[step]]
possess = { label = "hero" }

[[step]]
wait_until = { agent_alive = { label = "hero" }, timeout_ticks = 120 }

# 站稳(落定 40 拍)后记基准点。
[[step]]
wait_ticks = { n = 40 }

[[step]]
mark_agent = { label = "hero" }

# 落点周围地面区域(8×1×8 = 64 格,整层)砸前 dirt 计数(eq = 64:
# 地面必须一格不少)。
[[step]]
label = "砸前地面计数(eq 64)"
check = { count = { from = [5, -61, 11], to = [12, -61, 18], is = "dirt", eq = 64 } }

# 土方块从胶囊头顶上方 5 m 自由落体(初速 0;放行 R1 §4 口径)。
# 胶囊身位 y = −59.05,顶 = −58.15;锤块格心从 −53.2(顶上 ≈5 m)落下。
# 水平偏心 0.3 m(spawn x = 8.5 − 0.3 = 8.2,偏西:砸在肩上)。位移下限
# 取现场标定实测值的一半(实测值见冒烟运行输出与回报)。
[[step]]
label = "土方块头顶 5 m 自由落体"
spawn = { at = [8.2, -53.2, 14.5], count = 1, label = "hammer" }

# 等砸中(锤块变活实体后 ~80 拍落地弹开;再等凝固)。
[[step]]
wait_until = { live_entities = { ge = 1 }, timeout_ticks = 120 }

[[step]]
wait_ticks = { n = 120 }

[[step]]
screenshot = { name = "after-hit", expect = "画面中有一个灰色立方体(锤块已凝固)落在一截粉色竖直胶囊的旁边,两者相邻;地面没有大范围缺失(地形没有被砸破)" }

# 胶囊位移下限 = 现场标定实测值的一半(实测 0.544 m → 下限 0.27 m)。
[[step]]
label = "位移下限(标定)"
check = { agent_moved = { label = "hero", ge = 0.27 } }

[[step]]
label = "砸后地面计数(不变,eq 64)"
check = { count = { from = [5, -61, 11], to = [12, -61, 18], is = "dirt", eq = 64 } }

[[step]]
label = "主体仍存活"
check = { agent_alive = { label = "hero" } }
