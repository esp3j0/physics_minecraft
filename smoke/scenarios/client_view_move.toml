name = "client_view_move"
req = "REQ-013"
description = "bevy 客户端视距移动往返与 chunk 卸载/网格句柄回收机器锚(C02-2 D2)"
timeout_secs = 180

[viewer]
view_distance = 2

[[step]]
label = "初始俯视视角"
camera = { pos = [8.0, -48.0, 24.0], yaw = -90.0, pitch = -89.0 }

[[step]]
label = "等待初始区块就绪"
wait_ticks = { n = 30 }

[[step]]
label = "向 +x 飞行 32m 触发视距滑移"
fly = { to = [40.0, -48.0, 24.0], speed = 16.0 }

[[step]]
label = "等待远端区块装载与旧区卸载"
wait_ticks = { n = 60 }

[[step]]
label = "返回初始位置"
fly = { to = [8.0, -48.0, 24.0], speed = 16.0 }

[[step]]
label = "等待回程卸载与重装收敛"
wait_ticks = { n = 90 }

[[step]]
label = "校验稳态区块数恒等于 25 并连续保持 10 拍"
wait_until = { chunks_loaded = { eq = 25 }, hold_ticks = 10, timeout_ticks = 120 }

[[step]]
screenshot = { name = "after_move", expect = "连续平坦的 tan 色地表占满画面下部,地平线位于画面上部约四分之一处,左上角无 HUD 文字,画面中央无悬浮方块" }
