name = "req010-impact-pillar"
req = "REQ-010"
description = "4 格高石柱立在土地上,一颗方块以 20 m/s 侧撞柱身上部:石-土柱脚粘结(I = 7)是最小割,整根石柱从柱脚断开、带着撞击给的速度与角速度倾倒,落地后凝固;投射物(1 kg,远轻于 2.9 kg 的石柱)修正后几乎停在柱前(REQ-010 §5.7.1 最小割、§5.7.2 守恒分配)"
timeout_secs = 240

[server]
world_seed = 11

[server.destruction]
enabled = true

[server.cohesion]
enabled = true

[[step]]
label = "相机就位(侧面,看柱子倒向 +x)"
camera = { pos = [12.0, -54.0, 32.0], yaw = -90.0, pitch = -15.0 }

[[step]]
look_at = { target = [11.0, -58.0, 20.0] }

[[step]]
wait_until = { block = { pos = [9, -61, 14], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

[[step]]
label = "石柱(x=10,z=20,y=-60..-57)立在土地上"
fill = { from = [10, -60, 20], to = [10, -57, 20], block = "stone" }

[[step]]
wait_until = { block = { pos = [10, -57, 20], is = "stone" }, timeout_ticks = 600 }

[[step]]
wait_ticks = { n = 20 }

[[step]]
check = { block = { pos = [10, -57, 20], is = "stone" } }

[[step]]
screenshot = { name = "pillar", expect = "平整的棕色土地上立着一根 4 格高的灰色石柱;空中没有蓝色立方体" }

[[step]]
label = "发射方块(中心 (7.5,-57.45,20.5),20 m/s 沿 +x)撞柱身 (10,-58,20)–(10,-57,20)"
spawn = { at = [7.5, -57.45, 20.5], count = 1, velocity = [20.0, 0.0, 0.0], label = "projectile" }

# 撞击后先等实体出现(杜绝实体帧未到时空过),连拍按"状态证据"写 expect,
# 不锚定某一拍的精确形态(物理逐拍有抖动,viewer 帧与服务器拍间隔会漂)。
[[step]]
wait_until = { live_entities = { ge = 2 }, timeout_ticks = 300 }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-01", expect = "画面里有蓝色方块(石柱被撞后变成的活实体,和/或投射物)散布在原柱位附近;地面上不再有完整直立的 4 格灰色石柱——撞击已经发生,柱子已变成运动的活实体" }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-02", expect = "多个蓝色方块连成一根歪斜的柱形(被撞倒的石柱正在运动),不再直立在原柱位;空中没有灰色的凝固方块" }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-03", expect = "画面中有多个蓝色方块组成的群体,整体位置已明显偏离原柱位(x=10 的竖直线),证明柱子在倒下而不是原地散开" }

[[step]]
wait_ticks = { n = 4 }

[[step]]
screenshot = { name = "burst-04", expect = "蓝色方块群的高度已明显降低(低于原柱顶高度),整体朝撞击方向(+x,画面右侧)偏移;没有方块散落到远离柱体的位置" }

[[step]]
wait_ticks = { n = 5 }

[[step]]
screenshot = { name = "burst-05", expect = "蓝色方块群接近地面或已经落地,分布范围横向拉长(倒下的姿态);原柱位(x=10,z=20 的竖直线)附近空中没有直立的柱形" }

[[step]]
wait_ticks = { n = 8 }

[[step]]
screenshot = { name = "burst-06", expect = "蓝色(或正在凝固的灰蓝色)方块群横向排布在地面上,像一根倒下的横条;画面中没有直立的柱形,也没有方块悬在空中" }

[[step]]
wait_ticks = { n = 12 }

[[step]]
screenshot = { name = "burst-07", expect = "方块群贴地横躺(蓝色或已凝固成灰),姿态稳定;画面中没有直立的柱子" }

[[step]]
wait_ticks = { n = 20 }

[[step]]
screenshot = { name = "burst-08", expect = "方块群贴地(灰色或蓝色);画面里没有任何直立的柱形,原柱位的地面上没有竖起的方块" }

[[step]]
wait_until = { live_entities = { eq = 0 }, timeout_ticks = 1500, hold_ticks = 30 }

[[step]]
wait_ticks = { n = 20 }

[[step]]
screenshot = { name = "settled", expect = "终态:原来站立的 4 格石柱已整根倒下,作为一根灰色横条躺在原位置右侧的地面上;原位置没有残留的柱脚;一个灰色方块(投射物)凝固在横条附近的地面上;空中没有蓝色立方体" }

[[step]]
label = "全部落定、无悬浮"
check = { no_floating = { height = 1.5, still_ticks = 30 }, live_entities = { eq = 0 } }

[[step]]
label = "整根从柱脚断开:原位置 4 格全空"
check = { block = { pos = [10, -60, 20], is = "air" } }

[[step]]
check = { block = { pos = [10, -59, 20], is = "air" } }

[[step]]
check = { block = { pos = [10, -58, 20], is = "air" } }

[[step]]
check = { block = { pos = [10, -57, 20], is = "air" } }

[[step]]
label = "石柱向撞击方向(+x)倒下,横躺凝固(原位右侧 ≥ 4 格石)"
check = { count = { from = [11, -60, 16], to = [18, -57, 24], is = "stone", ge = 4 } }
