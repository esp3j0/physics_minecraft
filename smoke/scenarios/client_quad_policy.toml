name = "client_quad_policy"
req = "REQ-013"
description = "bevy 客户端本地策略狗(quad_mj1_ft):平地行走、perf 采样、附身改向(青绿高亮)、转回、解除附身恢复行走(REQ-013 §4/§7 场景 4)。"
timeout_secs = 300

[server]
world_seed = 3

[[server.agents]]
body = "quad"
position = [24.5, -59.5, 24.5]
controller = "policy"
policy = "quad_mj1_ft"
intent = [0.5, 0.0, 0.0]
leash_m = 16.0

[[step]]
label = "相机就位(拉近看狗)"
camera = { pos = [28.5, -53.5, 32.5], yaw = -90.0, pitch = -35.0 }

[[step]]
look_at = { target = [31.0, -59.7, 25.0] }

[[step]]
wait_until = { block = { pos = [24, -61, 24], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

[[step]]
label = "异步网格与材质预热(留足墙钟余量)"
wait_ticks = { n = 600 }

[[step]]
label = "认领狗"
adopt_agent = { label = "dog", near = [24.5, -59.5, 24.5], within = 7.0, timeout_ticks = 1200 }

[[step]]
mark_agent = { label = "dog", at = [24.5, -59.72, 24.5] }

[[step]]
label = "平地走 2.5 m"
wait_until = { agent_moved = { label = "dog", ge = 2.5 }, hold_ticks = 60, timeout_ticks = 1800 }

[[step]]
check = { agent_alive = { label = "dog" } }

[[step]]
label = "重置性能采样窗"
perf_reset = {}

[[step]]
label = "策略行走采样窗 240 拍"
wait_ticks = { n = 240 }

[[step]]
screenshot = { name = "flat-walk", expect = "棕色平地,一只品红色四足朝 +x 行走(方向以数值 check 为准),躯干水平,四条腿在身体下方;背景为浅蓝天空,远处地面渐隐入雾色,属有限世界自然边界,不算缺块" }

[[step]]
check = { agent_in = { label = "dog", from = [24.0, -59.95, 20.0], to = [40.0, -59.55, 28.5] } }

[[step]]
label = "附身四足"
possess = { label = "dog", follow = false }

[[step]]
mark_agent = { label = "dog" }

[[step]]
label = "原地转向(yaw 25°,边走边转的侧向失稳消除)"
intent = { move = [0.0, 0.0], yaw = 25.0, jump = false }

[[step]]
wait_ticks = { n = 360 }

[[step]]
label = "斜走 360 拍(航向保持 25°)"
intent = { move = [0.3, 0.0], yaw = 25.0, jump = false }

[[step]]
wait_ticks = { n = 360 }

[[step]]
label = "已侧移(相对附身基准 z ≥ +0.65,航向证据见截图)"
# C12 R1:改相对 mark 位移盒,消除 settle 等待×自主行走的 fps 耦合。
# 探针 20261126-055558(32fps):possess mark (31.33,-59.71,25.31) → 斜走末 (32.37,-59.74,26.28),Δ=(1.04,-0.03,0.97);
# R3 高 fps 探针交叉验证 Δ≈(1.01,·,0.95)。x 容差 ±0.35,z 下界 0.65 保留侧移证据,y 站立带 ±0.25。
check = { agent_delta_in = { label = "dog", from = [0.7, -0.25, 0.65], to = [1.4, 0.25, 1.3] } }

[[step]]
screenshot = { name = "possessed-turn", expect = "青绿色四足(附身材质),躯干朝向相对 +x 偏转,四腿在身体下方,无侧翻" }

[[step]]
label = "转回 +x"
intent = { move = [0.3, 0.0], yaw = 0.0, jump = false }

[[step]]
wait_ticks = { n = 720 }

[[step]]
screenshot = { name = "turned-back", expect = "青绿色四足,朝向转回接近 +x" }

[[step]]
label = "解除附身(恢复附身前意图)"
unpossess = {}

[[step]]
mark_agent = { label = "dog" }

[[step]]
label = "恢复后继续走 2.0 m"
wait_until = { agent_moved = { label = "dog", ge = 2.0 }, hold_ticks = 60, timeout_ticks = 1800 }

[[step]]
check = { agent_alive = { label = "dog" } }

[[step]]
label = "恢复行走位移与站立带(相对解除基准)"
# C12 R1:探针 055558:unpossess mark (34.50,-59.72,26.85) → 恢复末 (36.77,-59.70,26.97),Δ=(2.27,0.02,0.12)。
# wait_until agent_moved≥2.0 + hold 60 → |Δ|≈2.24;x 下界 1.8、上界 2.9。
check = { agent_delta_in = { label = "dog", from = [1.8, -0.25, -0.2], to = [2.9, 0.25, 0.45] } }

[[step]]
label = "侧移保留绝对护栏(z 只随时间漂移增大)"
# C12 R1:保留「转回不恢复侧向位置」证据。高 fps 实测 z≈26.71,32fps≈26.97;
# 低 fps 最坏漂移手算上界 ≈27.3,放宽到 28.0;x 放宽为 runaway 护栏(leash 16 m)。
check = { agent_in = { label = "dog", from = [20.0, -59.95, 26.0], to = [45.0, -59.55, 28.0] } }

[[step]]
screenshot = { name = "resumed", expect = "品红色四足(解除附身恢复原材质)朝 +x 行走,躯干水平" }
