name = "client_quad_policy"
req = "REQ-013"
description = "bevy 客户端本地策略狗(quad_mj1_ft):平地行走、perf 采样、附身改向(青绿高亮)、转回、解除附身恢复行走(REQ-013 §4/§7 场景 4)。"
timeout_secs = 300

[server]
world_seed = 3

[[server.agents]]
body = "quad"
position = [24.5, -59.5, 24.5]
controller = "policy"
policy = "quad_mj1_ft"
intent = [0.5, 0.0, 0.0]
leash_m = 16.0

[[step]]
label = "相机就位(拉近看狗)"
camera = { pos = [28.5, -53.5, 32.5], yaw = -90.0, pitch = -35.0 }

[[step]]
look_at = { target = [31.0, -59.7, 25.0] }

[[step]]
wait_until = { block = { pos = [24, -61, 24], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

[[step]]
label = "异步网格与材质预热(留足墙钟余量)"
wait_ticks = { n = 600 }

[[step]]
label = "认领狗"
adopt_agent = { label = "dog", near = [24.5, -59.5, 24.5], within = 7.0, timeout_ticks = 1200 }

[[step]]
mark_agent = { label = "dog", at = [24.5, -59.72, 24.5] }

[[step]]
label = "平地走 2.5 m"
wait_until = { agent_moved = { label = "dog", ge = 2.5 }, hold_ticks = 60, timeout_ticks = 1800 }

[[step]]
check = { agent_alive = { label = "dog" } }

[[step]]
label = "重置性能采样窗"
perf_reset = {}

[[step]]
label = "策略行走采样窗 240 拍"
wait_ticks = { n = 240 }

[[step]]
screenshot = { name = "flat-walk", expect = "棕色平地,一只品红色四足朝 +x 行走,躯干水平,四条腿在身体下方" }

[[step]]
check = { agent_in = { label = "dog", from = [24.0, -59.95, 20.0], to = [40.0, -59.55, 28.5] } }

[[step]]
label = "附身四足"
possess = { label = "dog", follow = false }

[[step]]
mark_agent = { label = "dog" }

[[step]]
label = "原地转向(yaw 25°,边走边转的侧向失稳消除)"
intent = { move = [0.0, 0.0], yaw = 25.0, jump = false }

[[step]]
wait_ticks = { n = 360 }

[[step]]
label = "斜走 360 拍(航向保持 25°)"
intent = { move = [0.3, 0.0], yaw = 25.0, jump = false }

[[step]]
wait_ticks = { n = 360 }

[[step]]
label = "已侧移(z ≥ 25.2,航向证据见截图)"
# R3 标定依据架构师探针 D 三次实测:转向末 (29.25±0.02, -59.73, 25.85±0.02)。
# z 下限 25.2 强制 ≥ +0.3 m 侧移(开环 z ≈ 24.9);x 容差 ±1.75 m。
check = { agent_in = { label = "dog", from = [27.5, -59.95, 25.2], to = [31.0, -59.55, 26.6] } }

[[step]]
screenshot = { name = "possessed-turn", expect = "青绿色四足(附身材质),躯干朝向相对 +x 偏转,四腿在身体下方,无侧翻" }

[[step]]
label = "转回 +x"
intent = { move = [0.3, 0.0], yaw = 0.0, jump = false }

[[step]]
wait_ticks = { n = 720 }

[[step]]
screenshot = { name = "turned-back", expect = "青绿色四足,朝向转回接近 +x" }

[[step]]
label = "解除附身(恢复附身前意图)"
unpossess = {}

[[step]]
mark_agent = { label = "dog" }

[[step]]
label = "恢复后继续走 2.0 m"
wait_until = { agent_moved = { label = "dog", ge = 2.0 }, hold_ticks = 60, timeout_ticks = 1800 }

[[step]]
check = { agent_alive = { label = "dog" } }

[[step]]
label = "恢复行走位置与站立带(保留改向侧移)"
# R3 标定依据探针 D 三次实测:恢复末 (33.60±0.03, -59.72, 26.71±0.03)。
# z 下限 26.0:转回只恢复航向、不恢复侧向位置。
check = { agent_in = { label = "dog", from = [31.5, -59.95, 26.0], to = [36.0, -59.55, 27.5] } }

[[step]]
screenshot = { name = "resumed", expect = "品红色四足(解除附身恢复原材质)朝 +x 行走,躯干水平" }
