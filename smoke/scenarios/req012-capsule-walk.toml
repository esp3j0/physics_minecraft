name = "req012-capsule-walk"
req = "REQ-012"
description = "胶囊在平地上走一段(x 4 → 12),到 1 格石台阶前起跳,站上台阶顶面(REQ-011 §11 第 1 行;AC-A2 的图形面)。R2 闭环化:到达起跳区/登上台阶都用 wait_until agent_in 判定,不再按拍数开环推算"
timeout_secs = 240

[server]
world_seed = 3

[[step]]
label = "相机就位(俯视走位带)"
camera = { pos = [10.0, -50.0, 26.0], yaw = -90.0, pitch = -25.0 }

[[step]]
look_at = { target = [10.0, -58.5, 14.0] }

# 装载就绪(左端 x 4 所在 chunk 已下发)。
[[step]]
wait_until = { block = { pos = [4, -61, 14], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

# 1 格台阶(x=12 一格 stone;比地面顶面高 1 格)。
[[step]]
label = "1 格台阶"
set_block = { pos = [12, -60, 14], block = "stone" }

[[step]]
wait_until = { block = { pos = [12, -60, 14], is = "stone" }, timeout_ticks = 600 }

# 胶囊出生在平地西端(x 4.5,顶面 + 0.95)。
[[step]]
label = "生成胶囊"
spawn_agent = { at = [4.5, -59.05, 14.5], yaw = 90.0, label = "hero" }

[[step]]
possess = { label = "hero" }

[[step]]
wait_until = { agent_alive = { label = "hero" }, timeout_ticks = 120 }

# 东行(+x,yaw 90°)4.3 m/s;持续意图(服务端保持)。
[[step]]
label = "东行"
intent = { move = [4.3, 0.0], yaw = 90.0, jump = false }

# 中途截图(走过平地段,闭环等到 x≈8 附近,不按拍数)。
[[step]]
wait_until = { agent_in = { label = "hero", from = [7.6, -59.6, 13.5], to = [8.6, -57.2, 15.5] }, timeout_ticks = 600 }

[[step]]
screenshot = { name = "walk-mid", expect = "画面中有一个直立的高亮色圆柱体(附身的胶囊)站在棕色平地上,正在向东(画面右)移动;地面上有一个灰色石台阶" }

# 续走:闭环等到起跳区(台阶西侧)。盒 x∈[9.2,10.0]:viewer 主体位置帧
# 10 拍一发(4.3 m/s → 一帧 0.72 m),等"看到"进盒时真实位置最多再走一帧
# (≤10.7),离台阶墙(12)≥1.3 m——帧采样相位再抖也不会贴墙起跳(10 次连
# 跑实证:起跳区盒东缘 10.8 时 1/10 偶发采样恰在盒缘,真实位置已贴墙,
# grounded 抖动丢跳,600 拍 0 连续成立)。盒宽 0.8 m ≥ 帧步 0.72 m,必有
# 采样落盒。
[[step]]
label = "到起跳区"
wait_until = { agent_in = { label = "hero", from = [9.2, -59.6, 13.5], to = [10.0, -57.2, 15.5] }, timeout_ticks = 600 }

# 跳跃(按下沿一次) + 全速保持 30 拍(从盒内 x 9.2..10.0 起跳,滞空前段
# 位移 ~2.15 m,峰值前段),随后**截断为爬行速度 0.8**:意图是保持语义,
# 不截断会全速走过台阶东缘落地东侧;0.8 爬行让落台阶后的滑行距离缩短到
# ~0.1 m,停位稳在台阶顶面带内(探针轨迹:起跳 t30 x≈11.1 峰值前,t52+
# 下沉,t≈70 落地 x≈13.0,速度已衰减)。
[[step]]
label = "跳上台阶"
intent = { move = [4.3, 0.0], yaw = 90.0, jump = true }

[[step]]
wait_ticks = { n = 30 }

[[step]]
label = "截断为爬行速度"
intent = { move = [0.8, 0.0], yaw = 90.0, jump = false }

# 站上台阶顶面:闭环 + 连续 10 拍成立(落稳防抖)。盒 x 取胶囊根能站在
# 台阶(x=12 格,世界 x 12..13)上的整个范围 ± 胶囊半径 0.3 再放裕量;
# y = 台阶顶面站稳高度带(实测站稳 root y = −58.10,平地 −59.10,dy=1.0)。
[[step]]
label = "站上台阶顶面"
wait_until = { agent_in = { label = "hero", from = [11.2, -58.6, 13.5], to = [13.8, -57.2, 15.5] }, hold_ticks = 10, timeout_ticks = 600 }

# 停(零意图;站在台阶顶面上)。
[[step]]
intent = { move = [0.0, 0.0], yaw = 90.0, jump = false }

[[step]]
wait_until = { agent_in = { label = "hero", from = [11.2, -58.6, 13.5], to = [13.8, -57.2, 15.5] }, hold_ticks = 10, timeout_ticks = 600 }

# 终点截图。
[[step]]
camera = { pos = [16.0, -54.0, 22.0], yaw = -135.0, pitch = -25.0 }

[[step]]
look_at = { target = [12.0, -58.5, 14.0] }

[[step]]
screenshot = { name = "walk-top", expect = "画面中高亮色圆柱体站在灰色石台阶上或其紧东侧,脚下比周围棕色地面高出一格;没有穿模或悬浮" }

# 终点 check:与"站上台阶顶面"同一个盒(R2-2)。
[[step]]
label = "终点在台阶顶面高度(同一盒)"
check = { agent_in = { label = "hero", from = [11.2, -58.6, 13.5], to = [13.8, -57.2, 15.5] } }

[[step]]
label = "确已上台阶(走过 x=12)"
check = { agent_in = { label = "hero", from = [11.7, -59.5, 13.5], to = [13.9, -57.2, 15.5] } }
