name = "req010-impact-corner"
req = "REQ-010"
description = "石门框去掉左柱成 7 字形悬臂;一颗方块以 40 m/s 斜撞门楣-柱顶拐角:撞击冲量沿粘结网络传到地基,最小割是石柱脚下的石-土粘结(C = 7),整个 7 字(6 格)从柱脚断开、作为一个复合刚体带着平动与翻滚飞出,投射物修正后继续前进;落地后凝固(REQ-010 §5.7.1 末行、§5.7.2;修订 11 改写,原 §5.6 击退语义见 impact_flow = false 回归集)"
timeout_secs = 240

[server]
world_seed = 11

[server.destruction]
enabled = true

[server.cohesion]
enabled = true
# 切块网格 S = 6(默认):7 字 x=7..10、y=-60..-58 落在同一切块立方内,断下后整体成一个复合体。

[[step]]
label = "相机就位"
camera = { pos = [9.0, -52.0, 36.0], yaw = -90.0, pitch = -15.0 }

[[step]]
look_at = { target = [8.0, -58.0, 17.0] }

[[step]]
wait_until = { block = { pos = [9, -61, 14], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

[[step]]
label = "两根石柱(y=-60..-59)与石门楣(y=-58,x=7..10)"
fill = { from = [7, -60, 20], to = [7, -59, 20], block = "stone" }

[[step]]
fill = { from = [10, -60, 20], to = [10, -59, 20], block = "stone" }

[[step]]
fill = { from = [7, -58, 20], to = [10, -58, 20], block = "stone" }

[[step]]
wait_until = { block = { pos = [7, -58, 20], is = "stone" }, timeout_ticks = 600 }

[[step]]
wait_ticks = { n = 20 }

[[step]]
label = "去掉左柱 → 7 字形(悬臂 3 ≤ B(石)=8,挂得住)"
fill = { from = [7, -60, 20], to = [7, -59, 20], block = "air" }

[[step]]
wait_ticks = { n = 20 }

[[step]]
check = { block = { pos = [7, -58, 20], is = "stone" } }

[[step]]
check = { block = { pos = [10, -59, 20], is = "stone" } }

# 低机位近拍:7 字贴着地平线下方,柱脚与地面的接触可见(高机位俯视时结构
# 悬在地平线上,看不出柱脚是否落地——20261103 基线 flagged)。
[[step]]
camera = { pos = [8.5, -57.0, 26.0], yaw = -90.0, pitch = -8.0 }

[[step]]
look_at = { target = [8.5, -58.5, 20.0] }

[[step]]
screenshot = { name = "seven-shape", expect = "一个灰色的 7 字形石结构立在棕色地面上:右侧一根两格高石柱,柱底与地面相接,柱顶向左横伸出一根四格长石门楣,门楣左端悬空;空中没有蓝色立方体" }

[[step]]
label = "相机推近拐角(连拍观察位)"
camera = { pos = [9.0, -55.0, 29.0], yaw = -90.0, pitch = -20.0 }

[[step]]
look_at = { target = [9.0, -58.0, 20.0] }

[[step]]
label = "发射方块撞门楣-柱顶拐角(跨 (10,-58) 与 (10,-59) 两行石头)"
spawn = { at = [16.0, -57.4, 20.2], count = 1, velocity = [-40.0, -7.0, 0.0], label = "projectile" }

# 撞击后先等 7 字变成实体(杜绝空过),连拍按状态证据写 expect。
[[step]]
wait_until = { live_entities = { ge = 2 }, timeout_ticks = 300 }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-01", expect = "画面里有蓝色方块(7 字被撞后变成的活实体,和/或投射物);原地不再有完整的灰色 7 字形——撞击已经发生" }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-02", expect = "多个蓝色方块组成的群体整体离开了原柱位(x=10),呈倾斜或移动中的姿态;主体(至少 5 格)连在一起,允许至多 1 个方块脱离主体单独飞行" }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-03", expect = "蓝色方块群整体位于原柱位左侧(x < 10)的空中,证明整个 7 字朝撞击反方向飞出;主体(至少 5 格)连在一起,允许至多 1 个方块完全脱离主体单独飞行" }

[[step]]
wait_ticks = { n = 4 }

[[step]]
screenshot = { name = "burst-04", expect = "蓝色方块群整体位于原柱位(x=10)左侧较远处的空中或已接近地面,仍是一个聚拢的群体(至多 1 个方块在外);投射物(若可见)在其右侧" }

[[step]]
wait_ticks = { n = 5 }

[[step]]
screenshot = { name = "burst-05", expect = "蓝色方块群整体明显向左下方落下(高度低于门楣原高度),主体聚拢成倾斜的形状;允许边缘个别方块分离,但主体(≥4 格)连在一起" }

[[step]]
wait_ticks = { n = 8 }

[[step]]
screenshot = { name = "burst-06", expect = "蓝色方块群接近地面或已接触地面翻滚,主体仍是聚拢的一团(不是散成单格);投射物(若可见)在右侧" }

[[step]]
wait_ticks = { n = 12 }

[[step]]
screenshot = { name = "burst-07", expect = "方块群落在原柱位左侧的地面上(蓝色或正在凝固),主体聚拢;投射物在右侧区域" }

[[step]]
wait_ticks = { n = 20 }

[[step]]
screenshot = { name = "burst-08", expect = "方块群贴在原柱位左侧的地面上(灰色或蓝色);原柱位(x=10 竖直线)附近没有残留的竖立结构,画面中只有一个小的分离方块允许在群体外" }

[[step]]
wait_until = { live_entities = { eq = 0 }, timeout_ticks = 1500, hold_ticks = 30 }

[[step]]
wait_ticks = { n = 20 }

# 低机位近拍终态:倒下的 L 形衬着地面(同 seven-shape 的理由,俯视高机位
# 看不清贴地的形状——20261103 基线 flagged 同类)。
[[step]]
camera = { pos = [4.0, -56.5, 27.0], yaw = -70.0, pitch = -12.0 }

[[step]]
look_at = { target = [4.0, -59.5, 18.0] }

[[step]]
screenshot = { name = "settled", expect = "终态:画面主体是一个灰色的 6 格 L 形(一长边四格、一短边两格)整体落在地面上,由倒下的 7 字凝固而成;整体姿态不限(翻倒后短边可以竖起或平躺),但 6 格连成一个整体;画面边缘附近的地面上另有一个单独的灰色小方块(投射物凝固),不属于 L 形;原来的 7 字位置(画面右侧远处)没有残留的竖立结构;空中没有蓝色立方体" }

[[step]]
label = "全部落定、无悬浮"
check = { no_floating = { height = 1.5, still_ticks = 30 }, live_entities = { eq = 0 } }

[[step]]
label = "整个 7 字从柱脚断开飞走:原位置 6 格全空"
check = { block = { pos = [10, -60, 20], is = "air" } }

[[step]]
check = { block = { pos = [10, -59, 20], is = "air" } }

[[step]]
check = { block = { pos = [10, -58, 20], is = "air" } }

[[step]]
check = { block = { pos = [9, -58, 20], is = "air" } }

[[step]]
check = { block = { pos = [8, -58, 20], is = "air" } }

[[step]]
check = { block = { pos = [7, -58, 20], is = "air" } }

[[step]]
label = "整个 7 字落在原位左侧(左侧区域 6 格石全部到位)"
check = { count = { from = [-2, -60, 14], to = [6, -57, 26], is = "stone", ge = 6 } }
