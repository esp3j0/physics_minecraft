name = "req010-impact-corner"
req = "REQ-010"
description = "石门框去掉左柱成 7 字形悬臂;一颗带初速的方块撞上门楣-柱顶拐角接缝:拐角格被撞碎(碎块竖直落下,§5 修订 8 零初速),石柱底部残留站立,剩余三格门楣失去地基,作为一根一字复合刚体整段转换并按 §5.6 继承撞击冲量——带水平击退漂移与轻微翻滚坠落,落在门楣原位侧旁地面凝固"
timeout_secs = 240

[server]
world_seed = 11

[server.destruction]
enabled = true

[server.cohesion]
enabled = true
# 门楣残段 3 格整段成一根复合条(默认 2 会按世界网格切成 2 格条 + 1 格碎块)。
compound_split_size = 4

[[step]]
label = "相机就位"
camera = { pos = [9.0, -52.0, 36.0], yaw = -90.0, pitch = -15.0 }

[[step]]
look_at = { target = [7.0, -58.0, 17.0] }

[[step]]
wait_until = { block = { pos = [9, -61, 14], is = "dirt" }, chunks_loaded = { ge = 25 }, timeout_ticks = 1200 }

[[step]]
label = "两根石柱(y=-60..-59)与石门楣(y=-58,x=5..8)"
fill = { from = [5, -60, 20], to = [5, -59, 20], block = "stone" }

[[step]]
fill = { from = [8, -60, 20], to = [8, -59, 20], block = "stone" }

[[step]]
fill = { from = [5, -58, 20], to = [8, -58, 20], block = "stone" }

[[step]]
wait_until = { block = { pos = [5, -58, 20], is = "stone" }, timeout_ticks = 600 }

[[step]]
wait_ticks = { n = 20 }

[[step]]
label = "去掉左柱 → 7 字形(悬臂 3 ≤ B(石)=8,挂得住)"
fill = { from = [5, -60, 20], to = [5, -59, 20], block = "air" }

[[step]]
wait_ticks = { n = 20 }

[[step]]
check = { block = { pos = [5, -58, 20], is = "stone" } }

[[step]]
check = { block = { pos = [8, -59, 20], is = "stone" } }

[[step]]
screenshot = { name = "seven-shape", expect = "一个 7 字形石结构:右侧一根两格高石柱站在地上,柱顶向左横伸出一根四格长石门楣,门楣左端悬空;空中没有蓝色立方体" }

[[step]]
label = "相机推近拐角(击退 burst 连拍观察位)"
camera = { pos = [7.0, -55.0, 28.0], yaw = -90.0, pitch = -20.0 }

[[step]]
look_at = { target = [7.0, -58.0, 20.0] }

[[step]]
label = "发射方块撞门楣-柱顶拐角接缝(瞄准跨 (8,-58) 与 (8,-59) 两行石头,避开 1 格齐平取样的格界对齐)"
spawn = { at = [14.0, -57.4, 20.2], count = 1, velocity = [-40.0, -7.0, 0.0], label = "projectile" }

[[step]]
wait_ticks = { n = 5 }

[[step]]
screenshot = { name = "burst-01-approach", expect = "一个 7 字形石结构清晰可见:两格高石柱立在右侧,四格长石门楣从柱顶向左横伸;拐角完好;一个蓝色投射物方块在结构右侧空中飞来尚未接触;空中没有其他蓝色立方体" }

[[step]]
wait_ticks = { n = 2 }

[[step]]
screenshot = { name = "impact", expect = "撞击已发生:原门楣失去支撑的三格已变成一根蓝色一字横条,大致仍在原门楣高度附近并开始向左水平漂移下坠(§5.6 击退);拐角处缺了格;一个蓝色方块(被撞碎的拐角碎块,修订 8 零初速)竖直落在石柱残段顶上;蓝色投射物已被弹开,出现在结构右侧空中;石柱底部灰色部分仍站立" }

[[step]]
wait_ticks = { n = 2 }

[[step]]
screenshot = { name = "burst-03-contact", expect = "蓝色一字横条向左下方漂移坠落中,与门楣原位置已有可见错位(击退水平漂移);柱顶上的蓝色碎块方块仍在;投射物在右侧空中继续飞离;石柱底部仍站立" }

[[step]]
wait_ticks = { n = 3 }

[[step]]
screenshot = { name = "burst-04-bar-born", expect = "蓝色横条继续左移下降,姿态仍基本保持一字横平(轻微翻滚);柱顶蓝色碎块方块仍在;投射物在右下方空中" }

[[step]]
wait_ticks = { n = 4 }

[[step]]
screenshot = { name = "burst-05-drift", expect = "蓝色横条已漂移到门楣原位左下方、位置明显偏离原门楣;柱顶蓝色碎块方块仍可见;投射物接近地面" }

[[step]]
wait_ticks = { n = 5 }

[[step]]
screenshot = { name = "burst-06-drift-more", expect = "蓝色横条贴近地面,已明显离开门楣原位(水平漂移还在增大);石柱残段与其顶上的蓝色碎块仍在;投射物在右侧低空或已落地滚动" }

[[step]]
wait_ticks = { n = 10 }

[[step]]
screenshot = { name = "bar-falling", expect = "蓝色一字横条几乎贴地或刚落地(尚未凝固);石柱底部残段仍立在原位;投射物在右下角地面附近滚动或弹跳;柱顶蓝色碎块可能仍在或已凝固" }

[[step]]
wait_ticks = { n = 30 }

[[step]]
screenshot = { name = "burst-07-late", expect = "门楣横条已凝固成灰色一字条,躺在门楣原位左侧的地面上;石柱底部灰色残段站立;右下角的投射物仍为蓝色(滚动中)或已凝固;空中蓝色立方体至多剩投射物一个" }

[[step]]
wait_until = { live_entities = { eq = 0 }, timeout_ticks = 1200 }

[[step]]
wait_ticks = { n = 20 }

[[step]]
label = "剩余门楣格已整段转走(承载判定接管;只有拐角被撞断才可能发生)"
check = { block = { pos = [5, -58, 20], is = "air" } }

[[step]]
check = { block = { pos = [6, -58, 20], is = "air" } }

[[step]]
check = { block = { pos = [7, -58, 20], is = "air" } }

[[step]]
label = "石柱底部残留仍站立(地上插着一小半)"
check = { block = { pos = [8, -60, 20], is = "stone" } }

[[step]]
check = { no_floating = { height = 1.5, still_ticks = 30 }, block = { pos = [8, -60, 20], is = "stone" } }

[[step]]
screenshot = { name = "settled", expect = "终态:一根灰色一字横条(原门楣三格)凝固躺在门楣原位左侧的地面上,横条姿态基本保持水平;石柱底部残段仍立在原地(被撞碎的拐角碎块竖直落回柱顶凝固,柱顶可能多出一格);发射方块凝固在结构右旁的地面上(落地翻滚后姿态可为斜躺);空中没有蓝色立方体" }
